# Example Application Configuration
# Copy this file to application.properties and update with your actual values

# Application Configuration
spring.application.name=edp-serialno-service
server.port=8080

# Logging Configuration
logging.level.root=INFO
logging.level.com.nokia.edp=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Job Scheduler Configuration
job.interval.seconds=3600
job.run-on-start=true

# FRNG Oracle Database Configuration (Source)
frng.datasource.url=jdbc:oracle:thin:@<ORACLE_HOST>:<PORT>:<SERVICE_NAME>
frng.datasource.username=<ORACLE_USERNAME>
frng.datasource.password=<ORACLE_PASSWORD>
frng.datasource.driver-class-name=oracle.jdbc.OracleDriver

# FRNG Query Configuration - Update with your customer codes and item numbers
frng.end-customer-codes=1000034759,1000062207,1000053780
frng.sold-to-customer-codes=1000034759,1000062207,1000053780
frng.item-nums=3HE17011AB,3HE20156AA

# MAC Address SQL Server Configuration (Source)
mac.datasource.url=jdbc:sqlserver://<SQL_SERVER_HOST>;databaseName=<DATABASE_NAME>;encrypt=false;trustServerCertificate=true
mac.datasource.username=<SQL_USERNAME>
mac.datasource.password=<SQL_PASSWORD>
mac.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Target SQL Server Configuration (Destination)
target.datasource.url=jdbc:sqlserver://<TARGET_HOST>;databaseName=<TARGET_DATABASE>;encrypt=true;trustServerCertificate=false;loginTimeout=30
target.datasource.username=<TARGET_USERNAME>
target.datasource.password=<TARGET_PASSWORD>
target.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
